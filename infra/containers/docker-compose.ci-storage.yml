# CI only. Layered on docker-compose.aws.yml by the Cloud Readiness job so the
# deployment stack boots without the retired AWS account. MinIO stands in for S3
# and is thrown away with the rest of the stack when the job ends.
services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: trademesh-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:9000:9000"

  backend:
    depends_on:
      minio:
        condition: service_started
