# Test-wide overrides.
#
# A .properties file is used rather than a second application.yml: a test-
# classpath application.yml SHADOWS the main one entirely, silently discarding
# every setting it does not restate. A .properties file is loaded alongside the
# yml and overrides only the keys it names.
#
# The outbox scheduler is off by default in tests. Spring caches an application
# context for the whole JVM run, so a single context with the scheduler enabled
# leaves a worker polling every second for the rest of the suite — claiming
# messages that other tests inserted and asserting on. Tests that want a worker
# call OutboxWorker.pollOnce() directly, which is deterministic.
# OutboxSchedulerDisabledInTestsTest enforces this rather than trusting it.
trademesh.outbox.enabled=false

# The suite intentionally reuses one PostgreSQL container across several
# differently configured Spring contexts. Keep each cached context's pool
# small so those contexts cannot exhaust PostgreSQL's connection limit.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
