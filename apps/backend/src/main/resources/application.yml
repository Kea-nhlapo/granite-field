spring:
  application:
    name: trademesh-backend
  profiles:
    default: ${SPRING_PROFILES_DEFAULT:local}
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    # Flyway SKIPS a misnamed migration with only an INFO log and starts
    # normally, so a typo ships as a silently unapplied schema change.
    # MigrationNamingTest guards the source tree; this guards the artifact.
    validate-migration-naming: true
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}

trademesh:
  runtime:
    environment: ${TRADEMESH_RUNTIME_ENVIRONMENT:local}
  events:
    source: ${TRADEMESH_EVENTS_SOURCE:trademesh-backend}
  outbox:
    enabled: ${TRADEMESH_OUTBOX_ENABLED:true}
    batch-size: ${TRADEMESH_OUTBOX_BATCH_SIZE:50}
    max-attempts: ${TRADEMESH_OUTBOX_MAX_ATTEMPTS:8}
    base-backoff: ${TRADEMESH_OUTBOX_BASE_BACKOFF:PT2S}
    max-backoff: ${TRADEMESH_OUTBOX_MAX_BACKOFF:PT1H}
    # Must exceed the slowest handler. A handler that outruns this gets a
    # second worker running beside it, which only an idempotent handler
    # survives — see OutboxHandler.
    visibility-timeout: ${TRADEMESH_OUTBOX_VISIBILITY_TIMEOUT:PT5M}
    poll-interval: ${TRADEMESH_OUTBOX_POLL_INTERVAL:PT1S}
    reap-interval: ${TRADEMESH_OUTBOX_REAP_INTERVAL:PT1M}
  security:
    jwt:
      # Required in every environment. Generate at least 32 random bytes and
      # keep the value outside source control.
      secret: ${AUTH_JWT_SECRET}
      issuer: ${AUTH_JWT_ISSUER:https://api.trademesh.local}
      access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P30D}
  supplier-invitations:
    time-to-live: ${SUPPLIER_INVITATION_TTL:P7D}
    validation-attempts: ${SUPPLIER_INVITATION_VALIDATION_ATTEMPTS:30}
    rate-limit-window: ${SUPPLIER_INVITATION_RATE_LIMIT_WINDOW:PT1M}
    max-tracked-clients: ${SUPPLIER_INVITATION_MAX_TRACKED_CLIENTS:10000}

# Local-only convenience defaults. Every other profile must supply these
# explicitly, so a shipped default password can never reach a real database.
# Enforced by DatasourceCredentialDefaultsTest, not by this comment.
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trademesh}
    username: ${DATABASE_USERNAME:trademesh}
    password: ${DATABASE_PASSWORD:trademesh}
