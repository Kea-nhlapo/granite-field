spring:
  application:
    name: trademesh-backend
  profiles:
    default: ${APP_ENV:${SPRING_PROFILES_DEFAULT:local}}
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    # Flyway SKIPS a misnamed migration with only an INFO log and starts
    # normally, so a typo ships as a silently unapplied schema change.
    # MigrationNamingTest guards the source tree; this guards the artifact.
    validate-migration-naming: true
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${FILE_UPLOAD_HTTP_MAX_SIZE:10MB}
      max-request-size: ${FILE_UPLOAD_HTTP_MAX_REQUEST_SIZE:11MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:NONE}
  max-http-request-header-size: ${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:16KB}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  tomcat:
    max-http-form-post-size: ${SERVER_MAX_HTTP_FORM_POST_SIZE:11MB}
    max-swallow-size: ${SERVER_MAX_SWALLOW_SIZE:12MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,diskSpace,postgis,objectStorage
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:logstash}

trademesh:
  runtime:
    environment: ${APP_ENV:${TRADEMESH_RUNTIME_ENVIRONMENT:local}}
  demo-accounts:
    enabled: ${DEMO_ACCOUNTS_ENABLED:false}
    password: ${DEMO_ACCOUNT_PASSWORD:}
  web:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    cors-max-age: ${CORS_MAX_AGE:PT1H}
    maximum-content-length: ${SERVER_MAX_CONTENT_LENGTH:12MB}
    rate-limits:
      window: ${API_RATE_LIMIT_WINDOW:PT1M}
      maximum-tracked-clients: ${API_RATE_LIMIT_MAX_TRACKED_CLIENTS:50000}
      login: ${API_RATE_LIMIT_LOGIN:10}
      invitations: ${API_RATE_LIMIT_INVITATIONS:60}
      uploads: ${API_RATE_LIMIT_UPLOADS:20}
      telemetry: ${API_RATE_LIMIT_TELEMETRY:120}
      qr-validation: ${API_RATE_LIMIT_QR_VALIDATION:30}
      otp-send: ${API_RATE_LIMIT_OTP_SEND:10}
      otp-verify: ${API_RATE_LIMIT_OTP_VERIFY:20}
      momo-initiate: ${API_RATE_LIMIT_MOMO_INITIATE:10}
      momo-transactions: ${API_RATE_LIMIT_MOMO_TRANSACTIONS:10}
  access:
    turnstile:
      provider: ${TURNSTILE_PROVIDER:unconfigured}
      endpoint: ${CLOUDFLARE_TURNSTILE_ENDPOINT:https://challenges.cloudflare.com/turnstile/v0/siteverify}
      secret-key: ${CLOUDFLARE_TURNSTILE_SECRET_KEY:}
      expected-hostname: ${CLOUDFLARE_TURNSTILE_EXPECTED_HOSTNAME:}
    otp:
      provider: ${OTP_PROVIDER:unconfigured}
      local-code: ${OTP_LOCAL_CODE:}
      send-cooldown: ${OTP_SEND_COOLDOWN:PT1M}
      providers:
        twilio:
          base-url: ${TWILIO_VERIFY_BASE_URL:https://verify.twilio.com/v2}
          account-sid: ${TWILIO_ACCOUNT_SID:}
          auth-token: ${TWILIO_AUTH_TOKEN:}
          verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
    momo-sign-in:
      poll-token-ttl: ${MOMO_SIGN_IN_POLL_TOKEN_TTL:PT10M}
  integrations:
    momo:
      provider: ${MOMO_PROVIDER:unconfigured}
      base-url: ${MOMO_BASE_URL:https://sandbox.momodeveloper.mtn.com}
      target-environment: ${MOMO_TARGET_ENVIRONMENT:sandbox}
      callback-host: ${MOMO_CALLBACK_HOST:}
      currency: ${MOMO_CURRENCY:ZAR}
      token-refresh-skew: ${MOMO_TOKEN_REFRESH_SKEW:PT30S}
      collections:
        subscription-key: ${MOMO_COLLECTIONS_SUBSCRIPTION_KEY:}
        api-user: ${MOMO_COLLECTIONS_API_USER:}
        api-key: ${MOMO_COLLECTIONS_API_KEY:}
      disbursements:
        subscription-key: ${MOMO_DISBURSEMENTS_SUBSCRIPTION_KEY:}
        api-user: ${MOMO_DISBURSEMENTS_API_USER:}
        api-key: ${MOMO_DISBURSEMENTS_API_KEY:}
  payments:
    escrow:
      poll-interval: ${ESCROW_POLL_INTERVAL:PT2S}
      transaction-timeout: ${ESCROW_TRANSACTION_TIMEOUT:PT2M}
      stream-timeout: ${ESCROW_STREAM_TIMEOUT:PT30M}
  events:
    source: ${TRADEMESH_EVENTS_SOURCE:trademesh-backend}
  outbox:
    enabled: ${TRADEMESH_OUTBOX_ENABLED:true}
    batch-size: ${TRADEMESH_OUTBOX_BATCH_SIZE:50}
    max-attempts: ${TRADEMESH_OUTBOX_MAX_ATTEMPTS:8}
    base-backoff: ${TRADEMESH_OUTBOX_BASE_BACKOFF:PT2S}
    max-backoff: ${TRADEMESH_OUTBOX_MAX_BACKOFF:PT1H}
    # Must exceed the slowest handler. A handler that outruns this gets a
    # second worker running beside it, which only an idempotent handler
    # survives — see OutboxHandler.
    visibility-timeout: ${TRADEMESH_OUTBOX_VISIBILITY_TIMEOUT:PT5M}
    poll-interval: ${TRADEMESH_OUTBOX_POLL_INTERVAL:PT1S}
    reap-interval: ${TRADEMESH_OUTBOX_REAP_INTERVAL:PT1M}
  security:
    jwt:
      # Required in every environment. Generate at least 32 random bytes and
      # keep the value outside source control.
      secret: ${AUTH_JWT_SECRET}
      issuer: ${AUTH_JWT_ISSUER:https://api.trademesh.local}
      access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P30D}
  supplier-invitations:
    time-to-live: ${SUPPLIER_INVITATION_TTL:P7D}
    validation-attempts: ${SUPPLIER_INVITATION_VALIDATION_ATTEMPTS:30}
    rate-limit-window: ${SUPPLIER_INVITATION_RATE_LIMIT_WINDOW:PT1M}
    max-tracked-clients: ${SUPPLIER_INVITATION_MAX_TRACKED_CLIENTS:10000}
    guest-base-url: ${SUPPLIER_INVITATION_GUEST_BASE_URL:http://localhost:5173/supplier-invitations/guest}
  delivery:
    search:
      speech-provider: ${DELIVERY_SPEECH_PROVIDER:unconfigured}
      speech-endpoint: ${GOOGLE_SPEECH_ENDPOINT:https://speech.googleapis.com/v1/speech:recognize}
      speech-api-key: ${GOOGLE_SPEECH_API_KEY:}
      language-codes: ${DELIVERY_SPEECH_LANGUAGE_CODES:en-ZA,zu-ZA,xh-ZA,af-ZA}
      distance-provider: ${DELIVERY_DISTANCE_PROVIDER:unconfigured}
      distance-endpoint: ${GOOGLE_DISTANCE_MATRIX_ENDPOINT:https://maps.googleapis.com/maps/api/distancematrix/json}
      maps-api-key: ${GOOGLE_MAPS_API_KEY:}
      maximum-audio-bytes: ${DELIVERY_MAXIMUM_AUDIO_BYTES:2097152}
      supplier-limit: ${DELIVERY_SUPPLIER_LIMIT:10}
    confirmation:
      time-to-live: ${DELIVERY_CONFIRMATION_TTL:P2D}
      confirmation-base-url: ${DELIVERY_CONFIRMATION_BASE_URL:http://localhost:5173/delivery/confirm}
  notifications:
    security:
      # Required outside the local profile. Generate 32 random bytes and store
      # their Base64 representation in the deployment secret manager.
      data-encryption-key: ${NOTIFICATION_DATA_ENCRYPTION_KEY}
    email:
      provider: ${EMAIL_PROVIDER:local}
      max-delivery-attempts: ${EMAIL_MAX_DELIVERY_ATTEMPTS:3}
      endpoint: ${EMAIL_PROVIDER_ENDPOINT:}
      api-key: ${EMAIL_PROVIDER_API_KEY:}
      from-address: ${EMAIL_FROM_ADDRESS:no-reply@trademesh.local}
    mobile:
      provider: ${MOBILE_NOTIFICATION_PROVIDER:unconfigured}
      max-delivery-attempts: ${MOBILE_NOTIFICATION_MAX_DELIVERY_ATTEMPTS:3}
      providers:
        twilio:
          base-url: ${TWILIO_API_BASE_URL:https://api.twilio.com}
          account-sid: ${TWILIO_ACCOUNT_SID:}
          auth-token: ${TWILIO_AUTH_TOKEN:}
          sms-from: ${TWILIO_SMS_NUMBER:}
          whats-app-from: ${TWILIO_WHATSAPP_NUMBER:}
        infobip:
          base-url: ${INFOBIP_BASE_URL:}
          api-key: ${INFOBIP_API_KEY:}
          sms-sender: ${INFOBIP_SMS_SENDER:}
          whatsapp-sender: ${INFOBIP_WHATSAPP_SENDER:}
          webhook-hmac-secret: ${INFOBIP_WEBHOOK_HMAC_SECRET:}
          connect-timeout: ${INFOBIP_CONNECT_TIMEOUT:PT5S}
          read-timeout: ${INFOBIP_READ_TIMEOUT:PT15S}
          whatsapp-templates:
            capacity-match-found.v1: ${INFOBIP_WHATSAPP_TEMPLATE_CAPACITY_MATCH_V1:}
            handover-confirmation-accepted.v1: ${INFOBIP_WHATSAPP_TEMPLATE_HANDOVER_ACCEPTED_V1:}
            handover-finalized-clean.v1: ${INFOBIP_WHATSAPP_TEMPLATE_HANDOVER_CLEAN_V1:}
            handover-finalized-disputed.v1: ${INFOBIP_WHATSAPP_TEMPLATE_HANDOVER_DISPUTED_V1:}
            escrow-released.v1: ${INFOBIP_WHATSAPP_TEMPLATE_ESCROW_RELEASED_V1:}
            delivery-confirmation.v1: ${INFOBIP_WHATSAPP_TEMPLATE_DELIVERY_CONFIRMATION_V1:}
  storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY}
    bucket: ${OBJECT_STORAGE_BUCKET:trademesh}
    max-upload-bytes: ${OBJECT_STORAGE_MAX_UPLOAD_BYTES:10485760}
    download-ttl: ${OBJECT_STORAGE_DOWNLOAD_TTL:PT5M}
    # Required by AWS S3 in opt-in regions such as af-south-1. Blank lets the
    # client negotiate, which is correct for MinIO and for always-on regions.
    region: ${OBJECT_STORAGE_REGION:}
    file-scanner:
      # fail-closed | mock | clamav. Unset means fail-closed: an environment that
      # forgets to choose refuses uploads instead of accepting unscanned files.
      provider: ${FILE_SCANNER_PROVIDER:fail-closed}
      clamav:
        host: ${CLAMAV_HOST:clamav}
        port: ${CLAMAV_PORT:3310}
        timeout: ${CLAMAV_TIMEOUT:PT30S}
  business:
    registry:
      # mock | unconfigured. Mocked registry data must never be an accident.
      provider: ${COMPANY_REGISTRY_PROVIDER:unconfigured}
  documents:
    extraction:
      provider: ${DOCUMENT_EXTRACTION_PROVIDER:unconfigured}
    processing:
      claim-timeout: ${DOCUMENT_PROCESSING_CLAIM_TIMEOUT:PT5M}
  aggregation:
    # PostGIS limits the first search. Hard constraints then decide eligibility;
    # the weights only rank candidates and never override a failed constraint.
    search-radius-meters: ${AGGREGATION_SEARCH_RADIUS_METERS:30000}
    maximum-distance-meters: ${AGGREGATION_MAXIMUM_DISTANCE_METERS:15000}
    minimum-window-overlap: ${AGGREGATION_MINIMUM_WINDOW_OVERLAP:PT30M}
    minimum-cargo-overlap-ratio: ${AGGREGATION_MINIMUM_CARGO_OVERLAP_RATIO:0.25}
    candidate-limit: ${AGGREGATION_CANDIDATE_LIMIT:100}
    distance-weight: ${AGGREGATION_DISTANCE_WEIGHT:0.35}
    window-weight: ${AGGREGATION_WINDOW_WEIGHT:0.25}
    cargo-weight: ${AGGREGATION_CARGO_WEIGHT:0.40}
    algorithm-version: ${AGGREGATION_ALGORITHM_VERSION:demand-group/v1}
  capacity-matching:
    # Hard constraints decide compatibility. These weights only rank offers
    # that passed every hard check.
    candidate-limit: ${CAPACITY_MATCH_CANDIDATE_LIMIT:100}
    distance-weight: ${CAPACITY_MATCH_DISTANCE_WEIGHT:0.30}
    capacity-fit-weight: ${CAPACITY_MATCH_CAPACITY_FIT_WEIGHT:0.20}
    cost-weight: ${CAPACITY_MATCH_COST_WEIGHT:0.20}
    timing-weight: ${CAPACITY_MATCH_TIMING_WEIGHT:0.30}
    maximum-added-distance-metres: ${CAPACITY_MATCH_MAXIMUM_ADDED_DISTANCE_METRES:100000}
    estimated-cost-per-kilometre-zar: ${CAPACITY_MATCH_COST_PER_KM_ZAR:12.50}
    reservation-ttl: ${CAPACITY_MATCH_RESERVATION_TTL:PT30M}
    expiry-batch-size: ${CAPACITY_MATCH_EXPIRY_BATCH_SIZE:100}
    expiry-interval: ${CAPACITY_MATCH_EXPIRY_INTERVAL:PT1M}
    algorithm-version: ${CAPACITY_MATCH_ALGORITHM_VERSION:capacity-match/v1}
  routing:
    provider: ${ROUTING_PROVIDER:mock}
    directions-endpoint: ${GOOGLE_DIRECTIONS_ENDPOINT:https://maps.googleapis.com/maps/api/directions/json}
    maps-api-key: ${GOOGLE_MAPS_API_KEY:}
    timeout: ${ROUTING_PROVIDER_TIMEOUT:PT3S}
    max-waypoints: ${ROUTING_MAX_WAYPOINTS:20}
    maximum-candidates: ${ROUTING_MAXIMUM_CANDIDATES:3}
    scoring:
      algorithm-version: ${ROUTING_SCORE_ALGORITHM_VERSION:route-score/v1}
      unknown-data-penalty: ${ROUTING_UNKNOWN_DATA_PENALTY:0.85}
      fuel-price-zar-per-litre: ${ROUTING_FUEL_PRICE_ZAR_PER_LITRE:24.00}
      fuel-litres-per-100-km: ${ROUTING_FUEL_LITRES_PER_100_KM:34.00}
      profiles:
        balanced:
          weights:
            time: 0.20
            distance: 0.10
            fuel: 0.15
            tolls: 0.10
            safety-exposure: 0.25
            road-quality: 0.10
            connectivity: 0.10
        high-value-electronics:
          weights:
            time: 0.10
            distance: 0.05
            fuel: 0.05
            tolls: 0.05
            safety-exposure: 0.35
            road-quality: 0.15
            connectivity: 0.25
        temperature-sensitive:
          weights:
            time: 0.40
            distance: 0.05
            fuel: 0.05
            tolls: 0.05
            safety-exposure: 0.10
            road-quality: 0.20
            connectivity: 0.15
        low-value-dry-goods:
          weights:
            time: 0.30
            distance: 0.15
            fuel: 0.25
            tolls: 0.15
            safety-exposure: 0.05
            road-quality: 0.05
            connectivity: 0.05
  telemetry:
    maximum-reading-age: ${TELEMETRY_MAXIMUM_READING_AGE:P7D}
    future-clock-skew: ${TELEMETRY_FUTURE_CLOCK_SKEW:PT5M}
    rate-limit-window: ${TELEMETRY_RATE_LIMIT_WINDOW:PT1M}
    maximum-readings-per-window: ${TELEMETRY_MAXIMUM_READINGS_PER_WINDOW:600}
    maximum-batch-size: ${TELEMETRY_MAXIMUM_BATCH_SIZE:100}
    downsample-after: ${TELEMETRY_DOWNSAMPLE_AFTER:P7D}
    downsample-bucket: ${TELEMETRY_DOWNSAMPLE_BUCKET:PT5M}
    retention: ${TELEMETRY_RETENTION:P90D}
    cleanup-batch-size: ${TELEMETRY_CLEANUP_BATCH_SIZE:5000}
    cleanup-interval: ${TELEMETRY_CLEANUP_INTERVAL:PT1H}
  tracking:
    stream-timeout: ${TRACKING_STREAM_TIMEOUT:PT30M}
    backhaul-radius-metres: ${BACKHAUL_RADIUS_METRES:30000}
    backhaul-time-window: ${BACKHAUL_TIME_WINDOW:PT6H}
    backhaul-candidate-limit: ${BACKHAUL_CANDIDATE_LIMIT:20}
    backhaul-distance-weight: ${BACKHAUL_DISTANCE_WEIGHT:0.70}
    backhaul-trust-weight: ${BACKHAUL_TRUST_WEIGHT:0.30}
  trust:
    scores:
      # The demo compresses a normally delayed verification cycle. The API
      # returns this mode so the UI cannot present it as production timing.
      verified-interval: ${TRUST_VERIFIED_INTERVAL:PT30S}
      evidence-half-life: ${TRUST_EVIDENCE_HALF_LIFE:P180D}
      maximum-verified-movement: ${TRUST_MAXIMUM_VERIFIED_MOVEMENT:5.00}
      verification-batch-size: ${TRUST_VERIFICATION_BATCH_SIZE:100}
      verification-schedule-mode: ${TRUST_VERIFICATION_SCHEDULE_MODE:COMPRESSED_DEMO}
      calculation-version: ${TRUST_SCORE_CALCULATION_VERSION:trust-score/v1}
  risk:
    # Two off-route readings reduce false alerts from a single noisy GPS fix.
    route-deviation-metres: ${RISK_ROUTE_DEVIATION_METRES:1000}
    route-deviation-confirmations: ${RISK_ROUTE_DEVIATION_CONFIRMATIONS:2}
    stopped-speed-kph: ${RISK_STOPPED_SPEED_KPH:2.0}
    unexpected-stop-duration: ${RISK_UNEXPECTED_STOP_DURATION:PT20M}
    maximum-telemetry-gap: ${RISK_MAXIMUM_TELEMETRY_GAP:PT5M}
    tracker-offline-duration: ${RISK_TRACKER_OFFLINE_DURATION:PT15M}
    fuel-drop-litres: ${RISK_FUEL_DROP_LITRES:30.0}
    fuel-drop-window: ${RISK_FUEL_DROP_WINDOW:PT20M}
    delivery-grace: ${RISK_DELIVERY_GRACE:PT30M}
    scan-interval: ${RISK_SCAN_INTERVAL:PT1M}
    scan-batch-size: ${RISK_SCAN_BATCH_SIZE:100}
    reading-window-limit: ${RISK_READING_WINDOW_LIMIT:1000}
    rule-version: ${RISK_RULE_VERSION:operational-risk/v1}
  handover:
    challenge-ttl: ${HANDOVER_CHALLENGE_TTL:PT5M}
    allowed-clock-skew: ${HANDOVER_ALLOWED_CLOCK_SKEW:PT2M}
    location-tolerance-metres: ${HANDOVER_LOCATION_TOLERANCE_METRES:250}
    max-quantity-note-length: ${HANDOVER_MAX_QUANTITY_NOTE_LENGTH:500}
    stream-timeout: ${HANDOVER_STREAM_TIMEOUT:PT30M}
    signing-secret: ${HANDOVER_QR_SIGNING_SECRET:}

# Local-only convenience defaults. Every other profile must supply these
# explicitly, so a shipped default password can never reach a real database.
# Enforced by DatasourceCredentialDefaultsTest, not by this comment.
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trademesh}
    username: ${DATABASE_USERNAME:trademesh}
    password: ${DATABASE_PASSWORD:trademesh}
trademesh:
  demo-accounts:
    enabled: true
  access:
    turnstile:
      provider: ${TURNSTILE_PROVIDER:local}
    otp:
      provider: ${OTP_PROVIDER:local}
      local-code: ${OTP_LOCAL_CODE:000000}
  integrations:
    momo:
      provider: ${MOMO_PROVIDER:mock}
  delivery:
    search:
      speech-provider: ${DELIVERY_SPEECH_PROVIDER:local}
      distance-provider: ${DELIVERY_DISTANCE_PROVIDER:local}
  storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:trademesh-minio}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:trademesh-minio}
    file-scanner:
      provider: ${FILE_SCANNER_PROVIDER:mock}
  business:
    registry:
      provider: ${COMPANY_REGISTRY_PROVIDER:mock}
  documents:
    extraction:
      provider: ${DOCUMENT_EXTRACTION_PROVIDER:mock}
  notifications:
    security:
      # Local-only key. Production has no fallback and refuses to start without one.
      data-encryption-key: ${NOTIFICATION_DATA_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    mobile:
      provider: ${MOBILE_NOTIFICATION_PROVIDER:local}
  handover:
    signing-secret: ${HANDOVER_QR_SIGNING_SECRET:local-only-handover-signing-secret-change-me}
