name: Quality Gate

# One workflow, one run, one verdict. The AWS release job was removed when the
# hackathon deployment was shut down; docs/deployment/aws-ec2.md still describes it.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request pushes are cancelled. Work on a branch that can release
  # is never cancelled, because a half-finished release is worse than a slow one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Compile, check formatting, and run all tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # Booting a stack here would duplicate Cloud Readiness below, which boots the
      # one that actually ships. Keep the cheap check that the developer stack is
      # still a valid compose file.
      - name: Validate the developer stack
        env:
          AUTH_JWT_SECRET: test-only-container-auth-secret-32-characters
          POSTGRES_PASSWORD: test-only-postgres-password
          OBJECT_STORAGE_ACCESS_KEY: test-only-minio-user
          OBJECT_STORAGE_SECRET_KEY: test-only-minio-password
        run: |
          export NOTIFICATION_DATA_ENCRYPTION_KEY
          NOTIFICATION_DATA_ENCRYPTION_KEY=$(printf '%s' 'test-only-notification-key-32b!!' | base64 -w0)
          docker compose -f ../../infra/containers/docker-compose.yml config --quiet

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting, lint, types, tests, and build
        run: npm run verify

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan committed history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependencies:
    name: Dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  api-contract:
    name: API Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate OpenAPI document
        uses: oasdiff/oasdiff-action/validate@54d7a752569cb30b644b7f27a362c1077973d1c0 # v0.1.14
        with:
          spec: packages/api-contracts/openapi/trademesh-v1.json

      - name: Check for an existing base contract
        if: github.event_name == 'pull_request'
        id: base-contract
        shell: bash
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:packages/api-contracts/openapi/trademesh-v1.json" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject breaking API changes
        if: github.event_name == 'pull_request' && steps.base-contract.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@54d7a752569cb30b644b7f27a362c1077973d1c0 # v0.1.14
        with:
          base: origin/${{ github.base_ref }}:packages/api-contracts/openapi/trademesh-v1.json
          revision: HEAD:packages/api-contracts/openapi/trademesh-v1.json
          fail-on: WARN

  cloud-readiness:
    name: Cloud Readiness
    runs-on: ubuntu-latest
    # clamd loads its signature database before the backend is allowed to start,
    # which is the slowest part of a cold boot and is exactly what the instance does.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build the image the release would deploy
        run: docker build -t trademesh-backend:ci apps/backend

      - name: Compose an .env the way the instance does
        working-directory: infra/containers
        run: |
          # Start from the file the host starts from, so a setting that is missing
          # there is missing here too. Every blank is filled the way the release
          # script fills it, with a throwaway value.
          cp .env.aws.example .env
          sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=trademesh-backend:ci|" .env
          # The AWS deployment was retired after the hackathon, so storage is a
          # throwaway MinIO from docker-compose.ci-storage.yml instead of real S3.
          sed -i "s|^OBJECT_STORAGE_ENDPOINT=.*|OBJECT_STORAGE_ENDPOINT=http://minio:9000|" .env
          sed -i "s|^OBJECT_STORAGE_REGION=.*|OBJECT_STORAGE_REGION=us-east-1|" .env
          sed -i "s|^OBJECT_STORAGE_BUCKET=.*|OBJECT_STORAGE_BUCKET=trademesh-ci|" .env
          sed -i "s|^OBJECT_STORAGE_ACCESS_KEY=.*|OBJECT_STORAGE_ACCESS_KEY=ci-minio-$(openssl rand -hex 8)|" .env
          sed -i "s|^OBJECT_STORAGE_SECRET_KEY=.*|OBJECT_STORAGE_SECRET_KEY=ci-only-$(openssl rand -hex 24)|" .env
          # 32 raw bytes, base64: the notification key is decoded, not read as text.
          sed -i "s|^NOTIFICATION_DATA_ENCRYPTION_KEY=$|NOTIFICATION_DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          # Anything still blank gets a value long enough for the strictest check.
          while IFS= read -r key; do
            sed -i "s|^${key}=$|${key}=ci-only-$(openssl rand -hex 24)|" .env
          done < <(grep -oP '^[A-Z0-9_]+(?==$)' .env)
          if grep -qE '^[A-Z0-9_]+=$' .env; then
            echo "a setting is still blank:"
            grep -E '^[A-Z0-9_]+=$' .env
            exit 1
          fi

      - name: Start throwaway object storage and create the bucket
        working-directory: infra/containers
        run: |
          compose="docker compose -f docker-compose.aws.yml -f docker-compose.ci-storage.yml --env-file .env"
          $compose up -d minio
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/ready && break
            sleep 2
          done
          # The readiness check asks whether the bucket exists, so it has to be there
          # before the backend boots. The runner's AWS CLI talks to MinIO directly.
          AWS_ACCESS_KEY_ID=$(grep -oP '^OBJECT_STORAGE_ACCESS_KEY=\K.*' .env) \
          AWS_SECRET_ACCESS_KEY=$(grep -oP '^OBJECT_STORAGE_SECRET_KEY=\K.*' .env) \
          AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://trademesh-ci

      - name: Boot the deployment stack
        working-directory: infra/containers
        run: |
          compose="docker compose -f docker-compose.aws.yml -f docker-compose.ci-storage.yml --env-file .env"
          trap '$compose logs --tail=80 backend' ERR
          $compose config --quiet
          $compose up -d --wait --wait-timeout 900

      - name: Confirm it answers, and can reach its database and bucket
        run: curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health/readiness

      - name: Tear down
        if: always()
        working-directory: infra/containers
        run: docker compose -f docker-compose.aws.yml -f docker-compose.ci-storage.yml --env-file .env down --volumes
