name: Quality Gate

# One workflow, one run, one verdict. The deploy job at the bottom is gated on the
# checks above it, so a red gate cannot reach the instance and there is no second
# run to go hunting for: the tick on the commit means "tested and released".
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request pushes are cancelled. Work on a branch that can release
  # is never cancelled, because a half-finished release is worse than a slow one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Compile, check formatting, and run all tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # Booting a stack here would duplicate Cloud Readiness below, which boots the
      # one that actually ships. Keep the cheap check that the developer stack is
      # still a valid compose file.
      - name: Validate the developer stack
        env:
          AUTH_JWT_SECRET: test-only-container-auth-secret-32-characters
          POSTGRES_PASSWORD: test-only-postgres-password
          OBJECT_STORAGE_ACCESS_KEY: test-only-minio-user
          OBJECT_STORAGE_SECRET_KEY: test-only-minio-password
        run: |
          export NOTIFICATION_DATA_ENCRYPTION_KEY
          NOTIFICATION_DATA_ENCRYPTION_KEY=$(printf '%s' 'test-only-notification-key-32b!!' | base64 -w0)
          docker compose -f ../../infra/containers/docker-compose.yml config --quiet

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting, lint, types, tests, and build
        run: npm run verify

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan committed history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependencies:
    name: Dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  api-contract:
    name: API Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate OpenAPI document
        uses: oasdiff/oasdiff-action/validate@54d7a752569cb30b644b7f27a362c1077973d1c0 # v0.1.14
        with:
          spec: packages/api-contracts/openapi/trademesh-v1.json

      - name: Check for an existing base contract
        if: github.event_name == 'pull_request'
        id: base-contract
        shell: bash
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:packages/api-contracts/openapi/trademesh-v1.json" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject breaking API changes
        if: github.event_name == 'pull_request' && steps.base-contract.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@54d7a752569cb30b644b7f27a362c1077973d1c0 # v0.1.14
        with:
          base: origin/${{ github.base_ref }}:packages/api-contracts/openapi/trademesh-v1.json
          revision: HEAD:packages/api-contracts/openapi/trademesh-v1.json
          fail-on: WARN

  cloud-readiness:
    name: Cloud Readiness
    runs-on: ubuntu-latest
    # clamd loads its signature database before the backend is allowed to start,
    # which is the slowest part of a cold boot and is exactly what the instance does.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build the image the release would deploy
        run: docker build -t trademesh-backend:ci apps/backend

      - name: Compose an .env the way the instance does
        working-directory: infra/containers
        run: |
          # Start from the file the host starts from, so a setting that is missing
          # there is missing here too. Every blank is filled the way the release
          # script fills it, with a throwaway value.
          cp .env.aws.example .env
          sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=trademesh-backend:ci|" .env
          # 32 raw bytes, base64: the notification key is decoded, not read as text.
          sed -i "s|^NOTIFICATION_DATA_ENCRYPTION_KEY=$|NOTIFICATION_DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          # Anything still blank gets a value long enough for the strictest check.
          while IFS= read -r key; do
            sed -i "s|^${key}=$|${key}=ci-only-$(openssl rand -hex 24)|" .env
          done < <(grep -oP '^[A-Z0-9_]+(?==$)' .env)
          if grep -qE '^[A-Z0-9_]+=$' .env; then
            echo "a setting is still blank:"
            grep -E '^[A-Z0-9_]+=$' .env
            exit 1
          fi

      - name: Boot the deployment stack
        working-directory: infra/containers
        run: |
          trap 'docker compose -f docker-compose.aws.yml --env-file .env logs --tail=80 backend' ERR
          docker compose -f docker-compose.aws.yml --env-file .env config --quiet
          docker compose -f docker-compose.aws.yml --env-file .env up -d --wait --wait-timeout 900

      - name: Confirm it answers
        run: curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health

      - name: Tear down
        if: always()
        working-directory: infra/containers
        run: docker compose -f docker-compose.aws.yml --env-file .env down --volumes

  deploy:
    name: Release to af-south-1
    # Every gate above has to be green. GitHub will not start this job otherwise.
    needs: [backend, frontend, secrets, api-contract, cloud-readiness]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # required to exchange the OIDC token for the AWS role
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # never interrupt a release mid-flight
    env:
      AWS_REGION: af-south-1
      ECR_REPOSITORY: trademesh-backend
      INSTANCE_ID: i-0f2df9d19fea4b986
      SITE_BUCKET: trademesh-site-698251583462
      DISTRIBUTION_ID: E1VXUDQWO5B99P
    steps:
      - name: Check out the commit that passed the gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve the release tag
        id: tag
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2

      - name: Build and push the backend image
        working-directory: apps/backend
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$SHA" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$SHA"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Release on the instance, with rollback
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $SHA" \
            --timeout-seconds 900 \
            --parameters "commands=[\"cd /opt/trademesh/granite-field && git fetch origin --prune && git checkout -f main && git reset --hard $SHA && bash infra/aws/deploy-on-instance.sh $SHA\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          for _ in $(seq 1 60); do
            sleep 15
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $status"
            [ "$status" = "InProgress" ] || [ "$status" = "Pending" ] || break
          done

          out=$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text)
          err=$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text)
          echo "--- instance output ---"
          printf '%s\n' "$out"
          printf '%s\n' "$err"

          if [ "$status" != "Success" ]; then
            # Only claim a rollback happened if the instance says one did.
            if printf '%s' "$out" | grep -q ROLLED_BACK; then
              echo "::error::Release failed. The instance rolled back to the previous image and is healthy."
            elif printf '%s' "$out" | grep -q ROLLBACK_FAILED; then
              echo "::error::Release failed AND the rollback failed. The service is down."
            else
              echo "::error::Release failed before deploying. The running stack was not touched."
            fi
            exit 1
          fi

      - name: Confirm the deployment answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://dbhptzazg1vi1.cloudfront.net/api/telemetry/readings")
          echo "api returned $code"
          # 401/403 mean Spring answered. 5xx or 000 mean it did not.
          case "$code" in 2*|4*) echo "backend is answering" ;; *) exit 1 ;; esac

      - name: Build the frontend
        working-directory: apps/frontend
        run: |
          npm ci
          npm run build

      - name: Publish the frontend
        working-directory: apps/frontend
        run: |
          aws s3 sync dist/ "s3://$SITE_BUCKET/" --delete
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*" >/dev/null

