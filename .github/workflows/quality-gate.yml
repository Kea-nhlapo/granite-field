name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Compile, check formatting, and run all tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Build and smoke-test the container stack
        env:
          AUTH_JWT_SECRET: test-only-container-auth-secret-32-characters
          POSTGRES_PASSWORD: test-only-postgres-password
          OBJECT_STORAGE_ACCESS_KEY: test-only-minio-user
          OBJECT_STORAGE_SECRET_KEY: test-only-minio-password
        run: |
          export NOTIFICATION_DATA_ENCRYPTION_KEY
          NOTIFICATION_DATA_ENCRYPTION_KEY=$(printf '%s' 'test-only-notification-key-32b!!' | base64 -w0)
          compose_file=../../infra/containers/docker-compose.yml
          docker compose -f "$compose_file" config --quiet
          docker compose -f "$compose_file" build backend
          trap 'docker compose -f "$compose_file" down --volumes' EXIT
          docker compose -f "$compose_file" up -d --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting, lint, types, tests, generated-client drift, and build
        run: npm run verify

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: npm run test:e2e

      - name: Upload sanitized Playwright screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-screenshots
          path: apps/frontend/test-results/**/*.png
          if-no-files-found: ignore

  frontend-live-backend:
    name: Frontend live backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: apps/frontend
        run: npm ci --no-audit --no-fund

      - name: Start the local Spring stack
        env:
          AUTH_JWT_SECRET: test-only-container-auth-secret-32-characters
          POSTGRES_PASSWORD: test-only-postgres-password
          OBJECT_STORAGE_ACCESS_KEY: test-only-minio-user
          OBJECT_STORAGE_SECRET_KEY: test-only-minio-password
        run: |
          export NOTIFICATION_DATA_ENCRYPTION_KEY
          NOTIFICATION_DATA_ENCRYPTION_KEY=$(printf '%s' 'test-only-notification-key-32b!!' | base64 -w0)
          compose_file=infra/containers/docker-compose.yml
          docker compose -f "$compose_file" config --quiet
          docker compose -f "$compose_file" build backend
          docker compose -f "$compose_file" up -d --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health

      - name: Call live login, refresh, and a domain operation without stubbing fetch
        working-directory: apps/frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
        run: npm run test:live-backend

      - name: Stop the local Spring stack
        if: always()
        env:
          AUTH_JWT_SECRET: test-only-container-auth-secret-32-characters
          POSTGRES_PASSWORD: test-only-postgres-password
          OBJECT_STORAGE_ACCESS_KEY: test-only-minio-user
          OBJECT_STORAGE_SECRET_KEY: test-only-minio-password
        run: |
          export NOTIFICATION_DATA_ENCRYPTION_KEY
          NOTIFICATION_DATA_ENCRYPTION_KEY=$(printf '%s' 'test-only-notification-key-32b!!' | base64 -w0)
          docker compose -f infra/containers/docker-compose.yml down --volumes

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan committed history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependencies:
    name: Dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  api-contract:
    name: API Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate OpenAPI document
        uses: oasdiff/oasdiff-action/validate@54d7a752569cb30b644b7f27a362c1077973d1c0 # v0.1.14
        with:
          spec: packages/api-contracts/openapi/trademesh-v1.json

      - name: Check for an existing base contract
        if: github.event_name == 'pull_request'
        id: base-contract
        shell: bash
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:packages/api-contracts/openapi/trademesh-v1.json" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject breaking API changes
        if: github.event_name == 'pull_request' && steps.base-contract.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@54d7a752569cb30b644b7f27a362c1077973d1c0 # v0.1.14
        with:
          base: origin/${{ github.base_ref }}:packages/api-contracts/openapi/trademesh-v1.json
          revision: HEAD:packages/api-contracts/openapi/trademesh-v1.json
          fail-on: WARN
